# No real participant identifiers or institution-specific paths are included.
# DARE-FALLSPREDICT lower-back configuration.
# Relative paths are resolved from this config file's folder.

[lower_back]
bronze_root = "../data/ravenna/bronze"
silver_root = "../data/ravenna/silver"
redcap_csv = "../data/ravenna/REDCap/fallspredict_data.csv"
sensor = "McRoberts"
visits = ["T0"]
min_size_bytes = 314572800
participant_ids = []
run_gait = true
run_time_in_bed = true
save_omx_to_parquet = false

# Experimental gyro evidence: any positive axis can rescue existing nonwear.
# No time-of-day restriction. Rate endpoints are excluded (10 < BR < 30).
[lower_back.respiration]
enabled = false
window_seconds = 60.0
overlap = 0.5
min_nonwear_bout_seconds = 900.0 # applied after respiration; keep bouts >=15 min
band_brpm = [10.0, 30.0]
save_window_features = true
min_band_rms_dps = 0.01
min_band_power_fraction = 0.5
min_peak_concentration = 0.5
min_peak_to_background_db = 6.0

# Production: GGIR 2023 matched thresholds, 60-min windows / 15-min step; no end-of-recording extension.
[lower_back.nonwear]
method = "ggir_2023_matched"
window_seconds = 3600.0
end_of_recording_correction = false

# Explicit recovery is available for verified rollover anchors; see timestamp-quality docs.
[lower_back.timestamps]
policy = "strict" # or "quarantine_bad_anchors"
