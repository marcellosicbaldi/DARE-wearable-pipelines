[build-system]
requires = ["setuptools==80.10.1", "wheel==0.46.3"]
build-backend = "setuptools.build_meta"

[project]
name = "DARE-wearable-pipelines"
version = "0.1.0"
description = "Bologna and Ravenna research workflows for wrist and lower-back wearables"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "MIT"
license-files = ["LICENSE*", "THIRD_PARTY_NOTICES.md", "licenses/*.txt"]
keywords = ["wearables", "gait", "sleep", "circadian", "HRV"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering",
  "Private :: Do Not Upload",
]
dependencies = [
  "numpy==1.26.4",
  "pandas==2.3.3",
  "polars==1.37.1",
  "matplotlib==3.8.4",
  "seaborn==0.13.2",
  "scipy==1.17.0",
  "neurokit2==0.2.12",
  "dotmap==1.3.30",
  "fastparquet==2025.12.0",
  "pyarrow==23.0.0",
  "openpyxl==3.1.5",
  "pyreadr==0.5.4",
  "mobgap==1.0.0",
  "scikit-learn==1.6.1",
  "tqdm==4.67.3",
]

[project.optional-dependencies]
heart-rate = [
  "beliefppg==0.3.1",
  "tensorflow==2.15.1",
  "tf-keras==2.15.1",
  "tensorflow-probability==0.22.1",
]

[dependency-groups]
dev = ["build==1.4.0", "twine==6.2.0"]

[tool.uv]
required-version = "==0.12.23"
environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.scripts]
gp-empatica-sleep = "gp_pipeline.cli.empatica_sleep:main"
ravenna-sleep = "ravenna_pipeline.cli.ravenna_sleep:main"
gp-lower-back = "gp_pipeline.cli.lower_back:main"
ravenna-lower-back = "ravenna_pipeline.cli.lower_back:main"
gp-hrv = "gp_pipeline.cli.hrv:main"
gp-heart-rate = "gp_pipeline.cli.heart_rate:main"
gp-aggregate-sleep = "gp_pipeline.aggregation.sleep:main"
gp-aggregate-hrv = "gp_pipeline.aggregation.hrv:main"
gp-aggregate-heart-rate = "gp_pipeline.aggregation.heart_rate:main"
gp-aggregate-gait = "gp_pipeline.aggregation.gait:main"
gp-aggregate-activity-intensity = "gp_pipeline.aggregation.activity_intensity:main"
gp-aggregate-all = "gp_pipeline.aggregation.overall:main"
gp-aggregate-redcap = "gp_pipeline.aggregation.redcap:main"
gp-aggregate-cohorts = "gp_pipeline.aggregation.cohorts:main"
ravenna-aggregate-sleep = "ravenna_pipeline.aggregation.sleep:main"
ravenna-aggregate-gait = "ravenna_pipeline.aggregation.gait:main"
ravenna-aggregate-activity-intensity = "ravenna_pipeline.aggregation.activity_intensity:main"
ravenna-aggregate-all = "ravenna_pipeline.aggregation.overall:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false
include = ["dare_wearables*", "gp_pipeline*", "ravenna_pipeline*"]
exclude = ["*.outputs", "*.outputs.*", "*.data", "*.data.*"]
