name: Validate GitHub distribution

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      MPLBACKEND: Agg
      TF_CPP_MIN_LOG_LEVEL: '2'
      TF_NUM_INTRAOP_THREADS: '1'
      TF_NUM_INTEROP_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.23'
          enable-cache: true
      - name: Install the locked environment
        run: uv sync --locked --extra heart-rate
      - name: Check dependency metadata
        run: uv pip check
      - name: Check publication contents
        run: uv run --no-sync python scripts/check_publication.py
      - name: Run synthetic regressions
        run: uv run --no-sync python -m unittest discover -s tests -v
      - name: Test installed commands and real model loading
        run: uv run --no-sync python scripts/check_install.py --heart-rate
      - name: Build wheel and source archive
        run: uv build
      - name: Check distribution metadata and contents
        run: |
          uv run --no-sync python -m twine check --strict dist/*
          uv run --no-sync python scripts/check_distributions.py
      - name: Verify wheel installation outside the source tree
        run: |
          uv pip install --no-deps --reinstall dist/*.whl
          uv run --no-sync python scripts/check_install.py --heart-rate --expect-wheel
      - name: Verify source archive can build the same wheel
        run: |
          uv build dist/*.tar.gz --wheel --out-dir rebuilt
          uv run --no-sync python scripts/check_rebuilt_wheel.py dist rebuilt
      - name: Save reviewed GitHub release candidates
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: github-release-candidate
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS.txt
          if-no-files-found: error
